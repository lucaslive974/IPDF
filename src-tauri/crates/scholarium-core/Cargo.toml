[package]
name = "scholarium-core"
version = "0.5.0"
edition = "2021"
description = "Hexagonal Core Domain, Ports, and Services for Scholarium Active Study Reader"

[dependencies]
rusqlite = "0.41.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-presence = "3.2.0"
