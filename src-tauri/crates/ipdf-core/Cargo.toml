[package]
name = "ipdf-core"
version = "0.1.0"
edition = "2021"
description = "Hexagonal Core Domain, Ports, and Services for IPDF Active Study Reader"

[dependencies]
base64 = "0.22"
rusqlite = "0.41.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }
