[package]
name = "scholarium"
version = "0.5.0"
description = "Scholarium — Active Study Reader (EPUB & PDF) with Hexagonal Architecture"
authors = ["lucaslive974"]
edition = "2021"

[lib]
name = "scholarium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
cloud-sync = ["scholarium-core/cloud-sync", "dep:tiny_http", "dep:url"]

[dependencies]
scholarium-core = { path = "crates/scholarium-core" }
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
url = { version = "2", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tiny_http = { version = "0.12", optional = true }
