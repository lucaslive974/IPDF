<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #151413;
        color: #f5f2eb;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .card {
        max-width: 420px;
        text-align: center;
        padding: 32px;
        border-radius: 12px;
        background: #1e1d1c;
        border: 1px solid #2d2b29;
      }
      h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: #c7c2b8;
        font-size: 0.9rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>{{TITLE}}</h2>
      <p>{{MESSAGE}}</p>
    </div>
  </body>
</html>
